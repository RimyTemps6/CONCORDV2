<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cde5ff">
<title>Concord</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<section id="auth">
  <div class="glass">
    <h1>Concord</h1>
    <p class="mut">Converse, poste status e ligue para seus amigos.</p>
    <button id="bGoogle" class="gbtn" type="button">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.2-3.9 7.2-9.6 7.2-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      <span>Continuar com Google</span>
    </button>
    <p id="err"></p>
    <button id="bTheme0" class="ghost">Alternar tema claro/escuro</button>
  </div>
</section>

<section id="setup" hidden>
  <div class="glass">
    <h1>Quase lá</h1>
    <p class="mut">Complete seu cadastro para entrar no Concord.</p>
    <form id="fSetup">
      <input id="stName" placeholder="Seu nome" maxlength="20" required>
      <button class="btn">Concluir cadastro</button>
    </form>
    <p id="stErr"></p>
    <button id="stCancel" class="ghost" type="button">Sair</button>
  </div>
</section>

<section id="app" hidden>
  <aside id="list">
    <header><h1 id="ttl">Conversas</h1><button id="bAdd" class="round" data-i="plus" title="Adicionar"></button></header>
    <label id="qwrap" class="search"><span data-i="search"></span><input id="q" placeholder="Buscar pessoas e grupos"></label>
    <div id="page"></div>
    <nav id="nav">
      <button data-t="chats" class="on"><span data-i="chat"></span><span>Conversas</span></button>
      <button data-t="status"><span data-i="status"></span><span>Status</span></button>
      <button data-t="me"><span data-i="user"></span><span>Perfil</span></button>
    </nav>
  </aside>
  <main id="chat">
    <header>
      <button id="bBack" class="act" data-i="back" title="Voltar"></button>
      <div id="chHead" class="hd"><b>Concord</b></div>
      <button id="bCall" class="act" data-i="phone" title="Ligação de voz" hidden></button>
      <button id="bVid" class="act" data-i="video" title="Chamada de vídeo" hidden></button>
      <button id="bMem" class="act" data-i="plus" title="Adicionar ao grupo" hidden></button>
    </header>
    <div id="msgs"><p class="empty">Escolha uma conversa para começar.</p></div>
    <form id="fSend"><input id="txt" autocomplete="off" placeholder="Digite uma mensagem"><button class="send" data-i="send" title="Enviar"></button></form>
  </main>
</section>

<div id="sv" hidden></div>
<div id="cv" hidden></div>
<div id="inc" hidden></div>
<div id="modal" hidden><div class="box glass" id="box"></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
